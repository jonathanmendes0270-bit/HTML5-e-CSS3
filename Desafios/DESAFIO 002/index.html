<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 02</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <P>Em HTML5,podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual teg deverá utilizar em cada caso.</P>
    <ul type="square">
        <abbr title="Use a teg <p>">
                <li>Parágrafo:</li>
        </abbr>
        <li type="square">
            <abbr title="Use as tegs <h1>,<h2>,<h3>,<h4>,<h5>,<h6>">Títulos;
            </abbr>
        </li>
        <li type="square"><abbr title="Use a teg <img src="" alt="">Imagens;</abbr></li>
        <li type="square"><abbr title="Use a teg <abbr>">Abreviações;</abbr></li>
        <li type="square"><abbr title="Use as teg <pre> e <code>">Código-fonte;</abbr></li>
        <li type="square"><abbr title="Use as tegs <ol> e <li>">Listas ordenadas;</abbr></li>
        <li type="square"><abbr title="Use as tegs <ul> e <li>">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
