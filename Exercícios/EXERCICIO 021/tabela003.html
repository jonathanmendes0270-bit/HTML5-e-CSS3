<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
            
        }

        td, th {
            padding: 10px;
            border: 1px solid black;
            
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>A</th>
                <th colspan="2" >B</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4" >D</td>
                <TD>E</TD>
                <td>F</td>
            </tr>
            <tr>
                <td>H</td>
                <TD>I</TD>
            </tr>
        </tbody>
        <tfoot>
            <td colspan="2" >L</td>
            <TD>M</TD>
        </tfoot>
    </table>
</body>
</html>
