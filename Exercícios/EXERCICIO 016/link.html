<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            height: 200px;
            width: 200px;
            color: rgb(33, 27, 19);
            border: 1px solid black;
            text-align: center;
            direction: none;
            

        }

        div:: :active {
            color: yellow;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: yellow;
        }

        a::after {
        content: "";
        display: inline-block;

        width: 16px;
        height: 16px;

        margin-left: 5px;

        background-image: url("img/link-externo.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
}


    </style>
</head>
<body>
    <h1>Personalisando Links</h1>
    <ul type="square">
        <div>
            <li><a href="https://gustavoguanabara.github.io">GitHub</a></li>
        </div>
        <div>
            <li><a class="especial" href="https://gustavoguanabara.github.io">Canal do YouTube</a></li>
        </div>
        
        <div>
            <li><a href="https://gustavoguanabara.github.io
                ">Site do Curso em Vídeo</a></li>
        </div>
        
    </ul>
</body>
</html>
